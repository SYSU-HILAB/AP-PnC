services:
  ros2-dev-amd64:
    build:
      context: ..
      dockerfile: docker/amd64/ros2-base.dockerfile
      target: base
    image: ap-pnc-ros2-base:amd64
    container_name: ap-pnc-ros2-amd64
    network_mode: host
    ipc: host
    volumes:
      - ../ros_packages:/workspace/src:rw
      - ../bringup:/workspace/bringup:rw
      - ../.artifacts/nmpc_wrapper:/workspace/artifacts:ro
    environment:
      - AP_PNC_DIR=/workspace
      - NMPC_BUNDLE_PATH=/workspace/artifacts/libnmpc_bundle.a
    stdin_open: true
    tty: true

  ros2-dev-arm64:
    build:
      context: ..
      dockerfile: docker/arm64/ros2-base.dockerfile
      target: base
    image: ap-pnc-ros2-base:arm64
    container_name: ap-pnc-ros2-arm64
    network_mode: host
    ipc: host
    volumes:
      - ../ros_packages:/workspace/src:rw
      - ../bringup:/workspace/bringup:rw
      - ../.artifacts/nmpc_wrapper:/workspace/artifacts:ro
    environment:
      - AP_PNC_DIR=/workspace
      - NMPC_BUNDLE_PATH=/workspace/artifacts/libnmpc_bundle.a
    stdin_open: true
    tty: true
