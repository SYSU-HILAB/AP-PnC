/simple_sim:
  ros__parameters:
    mass: 2.0
    gravity: 9.81
    inertia_xx: 0.02
    inertia_yy: 0.02
    inertia_zz: 0.03

    sim_rate: 200.0
    publish_rate: 10.0

    start_pos: [0.0, 0.0, 5.0]
    waypoint_tolerance: 0.3

    kp_pos: [12.0, 12.0, 12.0]
    kd_vel: [3.0, 3.0, 3.0]
    ki_pos: [0.5, 0.5, 0.5]
