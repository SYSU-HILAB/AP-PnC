    lidar:
      rings: 16
      points_per_ring: 360
      fov_h_deg: 360.0
      fov_v_deg: 30.0
      max_range: 30.0
      min_range: 0.2

    waypoints: [5.0, 0.0, 5.0, 0.0, 5.0, 5.0]

    # cx, cy, cz, half_x, half_y, half_z
    obstacle_boxes: [5.0, 0.0, 0.5, 0.4, 0.4, 0.5]
    # cx, cy, cz, radius
    obstacle_spheres: [0.0, 4.0, 1.0, 1.2]
