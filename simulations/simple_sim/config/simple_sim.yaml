# Simple Simulator Configuration
# LiDAR-equipped tailsitter UAV simulation with aerodynamics

/simple_sim:
  ros__parameters:
    mass: 2.0
    gravity: 9.81
    inertia_xx: 0.02
    inertia_yy: 0.02
    inertia_zz: 0.03
    sim_rate: 200.0
    publish_rate: 10.0
    map:
      length: 100.0
      width: 20.0
      height: 20.0
    build_shell: false
    scene:
      pillar_count: 0
      radius_min: 0.6
      radius_max: 1.2
      corridor_half_width: 2.0
      edge_margin: 5.0
      seed: 42
    start_pos:
    - -45.0
    - 0.0
    - 2.0
    waypoint_tolerance: 1.0
    waypoints:
    - -45.0
    - 0.0
    - 2.0
    - 45.0
    - 0.0
    - 2.0
    max_speed: 15.0
    max_thrust: 50.0
    kp_pos:
    - 2.0
    - 2.0
    - 2.0
    kd_vel:
    - 3.0
    - 3.0
    - 3.0
    ki_pos:
    - 0.2
    - 0.2
    - 0.2
    kp_att:
    - 8.0
    - 8.0
    - 8.0
    kd_att:
    - 1.5
    - 1.5
    - 1.5
    lidar:
      points_per_frame: 4000
      fov_h_deg: 360.0
      fov_v_min_deg: -7.0
      fov_v_max_deg: 52.0
      max_range: 40.0
      min_range: 0.1
    dump_pcd_frames: 30
    aero:
      enable: true
      type: lyu
      frame_convention: tailsitter
      scale: 1.0
      omit_moment: false
      omit_force: false
      wind:
      - 0.0
      - 0.0
      - 0.0
