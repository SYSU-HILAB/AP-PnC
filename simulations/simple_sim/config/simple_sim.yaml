/simple_sim:
  ros__parameters:
    mass: 2.0
    gravity: 9.81
    inertia_xx: 0.02
    inertia_yy: 0.02
    inertia_zz: 0.03

    sim_rate: 200.0
    publish_rate: 10.0

    # Map: length (x) x width (y) x height (z) [m], walls at the boundary.
    map:
      length: 100.0
      width: 20.0
      height: 20.0
    build_walls: true

    # Pillar run: fly from one end of the map to the other along y=0.
    start_pos: [-45.0, 0.0, 2.0]
    waypoint_tolerance: 0.3
    waypoints: [-45.0, 0.0, 2.0, 45.0, 0.0, 2.0]

    kp_pos: [12.0, 12.0, 12.0]
    kd_vel: [3.0, 3.0, 3.0]
    ki_pos: [0.5, 0.5, 0.5]
    kp_att: [8.0, 8.0, 8.0]

    # Livox Mid-360 style: 360 deg horizontal, -7..+52 deg vertical.
    lidar:
      points_per_frame: 4000
      fov_h_deg: 360.0
      fov_v_min_deg: -7.0
      fov_v_max_deg: 52.0
      max_range: 40.0
      min_range: 0.1

    # Pillars alternating along the corridor (cx, cy, radius, height).
    obstacle_cylinders: [-30.0, 4.0, 0.8, 20.0, -10.0, -4.0, 0.8, 20.0, 10.0, 4.0, 1.0, 20.0, 30.0, -4.0, 1.0, 20.0]
