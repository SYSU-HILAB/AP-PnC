apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-config
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-config
    app.kubernetes.io/part-of: ap-pnc

apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-config
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-config
    app.kubernetes.io/part-of: ap-pnc
data:
  # =========================================================================
  # SIM_TYPE: 仿真模式选择器
  # 可选值:
  #   - "simple-sim" (或 "simple"): 启动轻量级 C++ LiDAR + 气动力学仿真器
  #   - "gazebo": 启动 PX4-VTOL SITL + Gazebo Garden 仿真栈
  #   - "stop" (或 "none"): 停止所有仿真实例 (缩容为 0)
  # =========================================================================
  SIM_TYPE: "simple-sim"

  # 运行环境变量
  HEADLESS: "true"
  DISPLAY: ":0"

  # simple_sim ROS2 参数配置 (支持挂载并在运行时直接调整)
  simple_sim.yaml: |
    /simple_sim:
      ros__parameters:
        mass: 2.0
        gravity: 9.81
        inertia_xx: 0.02
        inertia_yy: 0.02
        inertia_zz: 0.03
        sim_rate: 200.0
        publish_rate: 10.0
        start_pos: [-45.0, 0.0, 2.0]
        waypoint_tolerance: 1.0
        waypoints: [-45.0, 0.0, 2.0, 45.0, 0.0, 2.0]
        max_speed: 15.0
        max_thrust: 50.0
        kp_pos: [2.0, 2.0, 2.0]
        kd_vel: [3.0, 3.0, 3.0]
        ki_pos: [0.2, 0.2, 0.2]
        kp_att: [8.0, 8.0, 8.0]
        kd_att: [1.5, 1.5, 1.5]
        lidar:
          points_per_frame: 4000
          fov_h_deg: 360.0
          fov_v_min_deg: -7.0
          fov_v_max_deg: 52.0
          max_range: 40.0
          min_range: 0.1
        aero:
          enable: true
          type: "lyu"
          frame_convention: "tailsitter"
          scale: 1.0
          omit_moment: false
          omit_force: false
          wind: [0.0, 0.0, 0.0]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim-dispatcher-sa
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-dispatcher
    app.kubernetes.io/part-of: ap-pnc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sim-dispatcher-role
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-dispatcher
    app.kubernetes.io/part-of: ap-pnc
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "watch", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sim-dispatcher-rb
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-dispatcher
    app.kubernetes.io/part-of: ap-pnc
subjects:
  - kind: ServiceAccount
    name: sim-dispatcher-sa
    namespace: sim
roleRef:
  kind: Role
  name: sim-dispatcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-dispatcher
  namespace: sim
  labels:
    app.kubernetes.io/name: sim-dispatcher
    app.kubernetes.io/part-of: ap-pnc
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-dispatcher
  template:
    metadata:
      labels:
        app: sim-dispatcher
        app.kubernetes.io/name: sim-dispatcher
        app.kubernetes.io/part-of: ap-pnc
    spec:
      serviceAccountName: sim-dispatcher-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: dispatcher
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBECONFIG
              value: /etc/rancher/k3s/k3s.yaml
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[sim-dispatcher] Starting AP-PnC Simulation Dispatcher in namespace '$NAMESPACE'..."

              LAST_APPLIED=""
              while true; do
                TARGET=$(kubectl get cm sim-config -n "$NAMESPACE" -o jsonpath='{.data.SIM_TYPE}' 2>/dev/null || true)
                if [ -n "$TARGET" ] && [ "$TARGET" != "$LAST_APPLIED" ]; then
                  echo "[sim-dispatcher] [$(date +'%Y-%m-%d %H:%M:%S')] Detected SIM_TYPE change: '${LAST_APPLIED}' -> '${TARGET}'"
                  case "$TARGET" in
                    simple|simple-sim|simple_sim)
                      echo "[sim-dispatcher] Activating simple-sim (scale: ap-pnc-simple-sim=1, ap-pnc-gazebo=0)..."
                      kubectl scale deployment ap-pnc-simple-sim -n "$NAMESPACE" --replicas=1 || true
                      kubectl scale deployment ap-pnc-gazebo -n "$NAMESPACE" --replicas=0 || true
                      LAST_APPLIED="$TARGET"
                      ;;
                    gazebo|gz)
                      echo "[sim-dispatcher] Activating gazebo (scale: ap-pnc-gazebo=1, ap-pnc-simple-sim=0)..."
                      kubectl scale deployment ap-pnc-gazebo -n "$NAMESPACE" --replicas=1 || true
                      kubectl scale deployment ap-pnc-simple-sim -n "$NAMESPACE" --replicas=0 || true
                      LAST_APPLIED="$TARGET"
                      ;;
                    stop|none|off)
                      echo "[sim-dispatcher] Stopping all simulations (scale: ap-pnc-simple-sim=0, ap-pnc-gazebo=0)..."
                      kubectl scale deployment ap-pnc-simple-sim -n "$NAMESPACE" --replicas=0 || true
                      kubectl scale deployment ap-pnc-gazebo -n "$NAMESPACE" --replicas=0 || true
                      LAST_APPLIED="$TARGET"
                      ;;
                    *)
                      echo "[sim-dispatcher] Warning: Unknown SIM_TYPE '$TARGET'. Expected 'simple-sim', 'gazebo', or 'stop'."
                      ;;
                  esac
                fi
                sleep 3
              done
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /bin/kubectl
              name: k3s-bin
              readOnly: true
            - mountPath: /var/lib/rancher/k3s/data
              name: k3s-data
              readOnly: true
            - mountPath: /etc/rancher/k3s/k3s.yaml
              name: k3s-yaml
              readOnly: true
            - mountPath: /etc/localtime
              name: host-localtime
              readOnly: true
      volumes:
        - name: k3s-bin
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
            type: Directory
        - name: k3s-yaml
          hostPath:
            path: /etc/rancher/k3s/k3s.yaml
            type: File
        - name: host-localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap-pnc-simple-sim
  namespace: sim
  labels:
    app.kubernetes.io/name: ap-pnc-simple-sim
    app.kubernetes.io/part-of: ap-pnc
    app.kubernetes.io/component: simulator
    sim.ap-pnc/type: simple-sim
spec:
  replicas: 0 # 由 sim-dispatcher 根据 sim-config 动态控制
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ap-pnc-simple-sim
  template:
    metadata:
      labels:
        app: ap-pnc-simple-sim
        app.kubernetes.io/name: ap-pnc-simple-sim
        app.kubernetes.io/part-of: ap-pnc
        sim.ap-pnc/type: simple-sim
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: simple-sim
          image: simple-sim:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DISPLAY
              valueFrom:
                configMapKeyRef:
                  name: sim-config
                  key: DISPLAY
                  optional: true
            - name: QT_X11_NO_MITSHM
              value: "1"
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /workspace/install/setup.bash
              CONFIG_ARG=""
              if [ -f /workspace/config/simple_sim.yaml ]; then
                CONFIG_ARG="--ros-args --params-file /workspace/config/simple_sim.yaml"
              fi
              echo "[simple-sim] Launching simple_sim_node with config: $CONFIG_ARG"
              exec ros2 run simple_sim simple_sim_node $CONFIG_ARG
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - mountPath: /workspace/config/simple_sim.yaml
              name: config-volume
              subPath: simple_sim.yaml
              readOnly: true
            - mountPath: /tmp/.X11-unix
              name: x11-unix
            - mountPath: /etc/localtime
              name: host-localtime
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: sim-config
        - name: x11-unix
          hostPath:
            path: /tmp/.X11-unix
            type: DirectoryOrCreate
        - name: host-localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap-pnc-gazebo
  namespace: sim
  labels:
    app.kubernetes.io/name: ap-pnc-gazebo
    app.kubernetes.io/part-of: ap-pnc
    app.kubernetes.io/component: simulator
    sim.ap-pnc/type: gazebo
spec:
  replicas: 0 # 由 sim-dispatcher 根据 sim-config 动态控制
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ap-pnc-gazebo
  template:
    metadata:
      labels:
        app: ap-pnc-gazebo
        app.kubernetes.io/name: ap-pnc-gazebo
        app.kubernetes.io/part-of: ap-pnc
        sim.ap-pnc/type: gazebo
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        # Container 1: stock PX4 v1.17.0 + Gazebo Jetty SITL (gz_x500)
        - name: px4-simulator
          image: px4-simulator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DISPLAY
              valueFrom:
                configMapKeyRef:
                  name: sim-config
                  key: DISPLAY
                  optional: true
            - name: QT_X11_NO_MITSHM
              value: "1"
            - name: ACCEPT_EULA
              value: "Y"
            - name: PRIVACY_CONSENT
              value: "Y"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            - name: XDG_RUNTIME_DIR
              value: "/tmp/runtime-px4"
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "[px4-simulator] Starting stock PX4 v1.17.0 Gazebo Jetty SITL..."
              cd /home/px4/PX4-Autopilot && make px4_sitl gz_x500
              exec bash
          stdin: true
          tty: true
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - mountPath: /tmp/.X11-unix
              name: x11-unix
            - mountPath: /etc/localtime
              name: host-localtime
              readOnly: true

        # Container 2: nav_infra — single navigation gateway (mavros2 in
        # the sim profile; livox + fast_lio + ekf_quat for the real one).
        # NAV_PROFILE selects the bringup profile (sim | real) via ConfigMap.
        - name: nav_infra
          image: nav_infra:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: NAV_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: sim-config
                  key: NAV_PROFILE
                  optional: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "[nav_infra] Starting navigation gateway (profile: ${NAV_PROFILE:-sim})..."
              exec ros2 launch bringup nav_infra.launch.py profile:=${NAV_PROFILE:-sim}
          stdin: true
          tty: true
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 512Mi

        # Container 3: AP-PnC ROS2 NMPC & Planning Node
        - name: ap-pnc
          image: ap-pnc:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DISPLAY
              valueFrom:
                configMapKeyRef:
                  name: sim-config
                  key: DISPLAY
                  optional: true
            - name: QT_X11_NO_MITSHM
              value: "1"
            - name: ACCEPT_EULA
              value: "Y"
            - name: PRIVACY_CONSENT
              value: "Y"
            - name: AP_PNC_DIR
              value: "/ap-pnc"
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "[ap-pnc] Starting AP-PnC Planning & Control stack..."
              exec bash
          stdin: true
          tty: true
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - mountPath: /tmp/.X11-unix
              name: x11-unix
            - mountPath: /etc/localtime
              name: host-localtime
              readOnly: true
      volumes:
        - name: x11-unix
          hostPath:
            path: /tmp/.X11-unix
            type: DirectoryOrCreate
        - name: host-localtime
          hostPath:
            path: /etc/localtime
            type: File
---
