name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install 'ruff==0.5.4'

      - name: Ruff Lint (tests)
        run: ruff check tests

      - name: Ruff Format Check (tests)
        run: ruff format --check tests
