name: Native Docker architecture acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      AP_PNC_DIR: ${{ github.workspace }}
      AP_PNC_ARCH: ${{ matrix.arch }}
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.artifacts/uv/venv
      UV_CACHE_DIR: ${{ github.workspace }}/.artifacts/uv/cache
      ROS_DOMAIN_ID: "179"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: CLI and unit tests
        run: |
          uv sync --project "$AP_PNC_DIR" --group dev
          mkdir -p "$AP_PNC_DIR/.artifacts/ci" "$AP_PNC_DIR/.artifacts/tests/docker-multiarch"
          uv run --project "$AP_PNC_DIR" ap-pnc lint
          uv run --project "$AP_PNC_DIR" pytest "$AP_PNC_DIR/test/cli" \
            --basetemp "$AP_PNC_DIR/.artifacts/tests/docker-multiarch/tmp" \
            -o "cache_dir=$AP_PNC_DIR/.artifacts/tests/docker-multiarch/cache" -q
      - name: Build all simulation and GUI images natively
        run: |
          actual="$(docker info --format '{{.Architecture}}')"
          case "$AP_PNC_ARCH/$actual" in
            arm64/aarch64|arm64/arm64|amd64/x86_64|amd64/amd64) ;;
            *) echo "Docker engine $actual does not match native target $AP_PNC_ARCH" >&2; exit 1 ;;
          esac
          uv run --project "$AP_PNC_DIR" ap-pnc docker build --arch "$AP_PNC_ARCH" --gui \
            > "$AP_PNC_DIR/.artifacts/ci/build.log" 2>&1
          uv run --project "$AP_PNC_DIR" ap-pnc sim build --target simple --arch "$AP_PNC_ARCH" \
            > "$AP_PNC_DIR/.artifacts/ci/simple-build.log" 2>&1
      - name: Read-only SITL and desktop smoke test
        run: |
          uv run --project "$AP_PNC_DIR" ap-pnc docker up --arch "$AP_PNC_ARCH" --gui
          docker exec nav_infra /entrypoint.sh python3 \
            /workspace/infra/sim_infra/gazebo/scripts/verify_runtime.py \
            > "$AP_PNC_DIR/.artifacts/ci/runtime.json"
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:6088/vnc.html > "$AP_PNC_DIR/.artifacts/ci/desktop.html"
      - name: Save logs and stop only this stack
        if: always()
        run: |
          mkdir -p "$AP_PNC_DIR/.artifacts/ci"
          docker compose -f "$AP_PNC_DIR/infra/sim_infra/gazebo/docker/docker-compose.yml" \
            --profile gui logs --no-color > "$AP_PNC_DIR/.artifacts/ci/runtime.log" 2>&1 || true
          uv run --project "$AP_PNC_DIR" ap-pnc docker down --arch "$AP_PNC_ARCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-${{ matrix.arch }}
          path: ${{ github.workspace }}/.artifacts/ci/
