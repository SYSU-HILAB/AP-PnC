repos:
  # clang-format for C/C++ code formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: \.(cpp|hpp|h|cc|cxx|c\+\+|hxx|h\+\+|c)$
        args: [--style=file]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  # The repository's YAML is written by the tooling (see tooling/simple_stack.py
  # and tooling/docker_runtime.py), so a formatter that rewrites it on every run
  # would fight the generator rather than guard it.

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Insert license in C/C++ files
        files: \.(c|h|cpp|hpp)$
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "/*| *| */"
          - --use-current-year
          - --remove-header

      - id: insert-license
        name: Insert license in Python files
        files: \.py$
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "#"
          - --use-current-year
          - --remove-header

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      - id: ruff
        name: Ruff Lint (tests)
        files: ^tests/
      - id: ruff-format
        name: Ruff Format (tests)
        files: ^tests/
