/global_planning_node:
  ros__parameters:
    MapTopic: "/voxel_map"

    TargetTopic: "/move_base_simple/goal"

    DilateRadius: 0.5

    VoxelWidth: 0.25

    MapBound: [ -50.0, 50.0, -50.0, 50.0, 0.0, 5.0 ]

    TimeoutRRT: 0.02

    MaxVelMag: 15.0

    MaxBdrMag: 2.1

    MaxTiltAngle: 1.05

    MinThrust: 1.0

    MaxThrust: 20.0

    VehicleMass: 0.61

    GravAcc: 9.8

    HorizDrag: 0.70

    VertDrag: 0.80

    ParasDrag: 0.01

    SpeedEps: 0.0001

    # 时间惩罚大，则alpha在振荡，这是不想要打，而避障过，还是稳一点好，并且也拟合不好
    # 室内避障6m左右是在30-60
    #
    WeightT: 200.0

    # pos,vel,rate,theta,thrust
    ChiVec: [ 1.0e+4, 1.0e+4, 1.0e+3, 1.0e+4, 1.0e+5 ]

    SmoothingEps: 1.0e-2

    IntegralIntervs: 16

    RelCostTol: 1.0e-4

    UavScale: 1.0
