apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap-pnc-simple-sim
  namespace: sim
  labels:
    app.kubernetes.io/name: ap-pnc-simple-sim
    app.kubernetes.io/part-of: ap-pnc
    app.kubernetes.io/component: simulator
    sim.ap-pnc/type: simple-sim
spec:
  replicas: 0 # 由 sim-dispatcher 根据 sim-config 动态控制
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ap-pnc-simple-sim
  template:
    metadata:
      labels:
        app: ap-pnc-simple-sim
        app.kubernetes.io/name: ap-pnc-simple-sim
        app.kubernetes.io/part-of: ap-pnc
        sim.ap-pnc/type: simple-sim
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: simple-sim
          image: simple-sim:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DISPLAY
              valueFrom:
                configMapKeyRef:
                  name: sim-config
                  key: DISPLAY
                  optional: true
            - name: QT_X11_NO_MITSHM
              value: "1"
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /workspace/.artifacts/colcon/install/setup.bash
              echo "[simple-sim] Launching lockstep tracking simulator (initially paused)"
              exec ros2 launch bringup simple_sim.launch.py rviz:=false
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - mountPath: /tmp/.X11-unix
              name: x11-unix
            - mountPath: /etc/localtime
              name: host-localtime
              readOnly: true
      volumes:
        - name: x11-unix
          hostPath:
            path: /tmp/.X11-unix
            type: DirectoryOrCreate
        - name: host-localtime
          hostPath:
            path: /etc/localtime
            type: File
