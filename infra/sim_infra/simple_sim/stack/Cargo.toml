[package]
name = "ap-pnc-offline"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
flatness-ffi = []

[dependencies]
dora-node-api = { version = "=1.0.1", default-features = false, features = ["tracing", "metrics"] }
# Match dora 1.0.1's OTel stack; do not install a competing provider/subscriber.
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
sha2 = "0.10"
rerun = { version = "=0.38.1", default-features = false, features = ["sdk"] }

[profile.release]
opt-level = 1
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev]
debug = 0
incremental = false
