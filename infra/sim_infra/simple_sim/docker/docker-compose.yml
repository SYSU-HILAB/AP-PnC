services:
  simple-sim:
    build:
      context: ${AP_PNC_DIR:?Set absolute AP_PNC_DIR}
      dockerfile: ${AP_PNC_DIR}/infra/sim_infra/simple_sim/docker/simple-sim.dockerfile
      network: host
    image: simple-sim:latest
    container_name: simple-sim
    network_mode: host
    environment:
      - AP_PNC_DIR=/workspace
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Only mount run data: mounting all artifacts would hide the image's install/bundle.
      - ${AP_PNC_DIR}/.artifacts/benchmark:/workspace/.artifacts/benchmark
      - ${AP_PNC_DIR}/core/bringup/config:/workspace/core/bringup/config:ro
    command: bash
    stdin_open: true
    tty: true
