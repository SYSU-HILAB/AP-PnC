services:
  px4-simulator:
    build:
      context: ../../../..
      dockerfile: infra/sim_infra/gazebo/docker/px4-simulator.dockerfile
      network: host
    image: px4-simulator:latest
    container_name: px4-simulator
    privileged: true
    network_mode: host
    runtime: nvidia
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=/tmp/runtime-px4
    volumes:
      - ${HOME}/.Xauthority:/home/px4/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.gz/sim:/home/px4/.gz/sim
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, graphics, utility, video]
    user: "1002:1002"
    command: bash
    stdin_open: true
    tty: true

  qground_control:
    build:
      context: ../../../..
      dockerfile: infra/sim_infra/gazebo/docker/qgc.dockerfile
      network: host
    image: qground_control:latest
    container_name: qground_control
    privileged: true
    network_mode: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    volumes:
      - ${HOME}/.Xauthority:/qgc/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../../../artifacts/benchmarks/ulgs:/home/qgc/artifacts/benchmarks/ulgs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, graphics, utility, video]
    command: qgc

  # nav_infra: single base-services gateway — mavros2 + px4ctrl (FCU
  # interface, tracking/NMPC controller modes, state adapter); livox +
  # fast_lio + ekf_quat join in the real profile. Research code (planner +
  # c_nmpc) stays in the ap-pnc core.
  nav_infra:
    build:
      context: ../../../..
      dockerfile: infra/nav_infra/docker/Dockerfile
    image: nav_infra:latest
    container_name: nav_infra
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    # Self-contained image (bringup baked in); config updates go through an
    # image rebuild or a k3s ConfigMap overlay — NOT a bind mount (the
    # /workspace/bringup symlink resolves into the colcon install share).
    command: ros2 launch bringup nav_infra.launch.py profile:=sim
    stdin_open: true
    tty: true
    depends_on:
      - px4-simulator

  ap-pnc:
    build:
      context: ../../../..
      dockerfile: infra/sim_infra/gazebo/docker/ap-pnc.dockerfile
    image: ap-pnc:latest
    container_name: ap-pnc
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - AP_PNC_DIR=/workspace
      - NMPC_BUNDLE_PATH=/workspace/artifacts/libnmpc_bundle.a
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../../../../.artifacts/nmpc_wrapper/libnmpc_bundle.a:/workspace/artifacts/libnmpc_bundle.a
      - ../../../../core/ros_packages:/workspace/src
      - ../../../../core/bringup:/workspace/bringup
      - ../../../../artifacts/simulations/temp_data:/workspace/artifacts/simulations/temp_data
    command: bash
    stdin_open: true
    tty: true
    depends_on:
      - qground_control
      - px4-simulator
      - nav_infra
